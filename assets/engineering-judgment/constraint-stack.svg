<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">Five-layer constraint stack</title><desc id="d">Mandate, decision, constraint, evidence, and recovery connected by ownership.</desc><rect width="1600" height="900" fill="#f0eee5"/><text x="90" y="85" fill="#12201c" font-family="Arial" font-size="20" letter-spacing="4">ARCHITECTURE CONSTRAINT STACK</text><g font-family="Arial"><g transform="translate(210 155)"><rect width="1180" height="110" fill="#07100e"/><text x="35" y="45" fill="#c8fa58" font-size="15">LAYER 01</text><text x="250" y="69" fill="#f5f7f1" font-size="34" font-weight="700">MANDATE</text><text x="610" y="66" fill="#9aa7a2" font-size="20">Outcome · scope · owner · stop condition</text></g><g transform="translate(250 285)"><rect width="1100" height="110" fill="#11211d"/><text x="35" y="45" fill="#67e8ca" font-size="15">LAYER 02</text><text x="240" y="69" fill="#f5f7f1" font-size="34" font-weight="700">DECISION</text><text x="590" y="66" fill="#9aa7a2" font-size="20">Context · alternatives · consequences</text></g><g transform="translate(290 415)"><rect width="1020" height="110" fill="#173129"/><text x="35" y="45" fill="#c8fa58" font-size="15">LAYER 03</text><text x="230" y="69" fill="#f5f7f1" font-size="34" font-weight="700">CONSTRAINT</text><text x="570" y="66" fill="#a9b8b1" font-size="20">Tests · policies · dependency rules</text></g><g transform="translate(330 545)"><rect width="940" height="110" fill="#255044"/><text x="35" y="45" fill="#c8fa58" font-size="15">LAYER 04</text><text x="220" y="69" fill="#f5f7f1" font-size="34" font-weight="700">EVIDENCE</text><text x="535" y="66" fill="#c0d0c9" font-size="20">Result · version · trace</text></g><g transform="translate(370 675)"><rect width="860" height="110" fill="#c8fa58"/><text x="35" y="45" fill="#244020" font-size="15">LAYER 05</text><text x="210" y="69" fill="#07100e" font-size="34" font-weight="700">RECOVERY</text><text x="500" y="66" fill="#294225" font-size="20">Trigger · rollback · authority</text></g></g></svg>
